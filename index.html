<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dohm S.A. - Gestión Integral SHMA</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        :root { --primary: #2c3e50; --accent: #e67e22; --bg: #f4f7f6; --text: #333; --white: #ffffff; --danger: #e74c3c; --success: #27ae60; --na: #95a5a6; }
        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); margin: 0; padding-bottom: 90px; color: var(--text); }
        header { background: var(--primary); color: white; padding: 15px; text-align: center; }
        
        /* SUBTÍTULO DEL ENCABEZADO AGRANDADO */
        header small { opacity: 0.9; font-size: 1.1rem; font-weight: bold; display: block; margin-top: 5px; }
        
        .tabs { display: flex; position: sticky; top: 0; background: white; z-index: 100; border-bottom: 2px solid #ddd; overflow-x: auto; }
        .tab-btn { flex: 1; padding: 12px 5px; border: none; background: none; font-weight: bold; color: #7f8c8d; font-size: 0.75rem; text-transform: uppercase; white-space: nowrap; }
        .tab-btn.active { color: var(--accent); border-bottom: 3px solid var(--accent); }

        .container { padding: 6px; max-width: 650px; margin: auto; }
        .card { background: var(--white); border-radius: 8px; padding: 12px; margin-bottom: 8px; border: 1px solid #eee; position: relative; }
        
        /* TÍTULOS DE SECCIONES (H3) AGRANDADOS */
        h3 { margin: 0 0 10px 0; font-size: 1.1rem; color: var(--primary); border-left: 5px solid var(--accent); padding-left: 8px; text-transform: uppercase; }
        
        .field { margin-bottom: 12px; }
        
        /* ETIQUETAS (LABELS) AGRANDADAS */
        label { display: block; font-size: 0.95rem; font-weight: bold; margin-bottom: 4px; color: #444; }
        
        /* TEXTO DENTRO DE MENÚS Y CAMPOS AGRANDADOS */
        input, select, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 1.1rem; background: #fff; color: #000; }
        input:disabled, select:disabled, textarea:disabled { background: #e9ecef !important; color: #666 !important; }

        /* INSPECCIÓN EN 1 RENGLÓN */
        .check-item { display: flex; align-items: center; justify-content: space-between; padding: 6px; border-bottom: 1px solid #f2f2f2; gap: 4px; }
        .item-desc { flex: 1; font-size: 0.8rem; line-height: 1.2; color: #333; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; white-space: normal; }
        .item-controls { display: flex; gap: 4px; flex-shrink: 0; }
        .btn-status { border: 1px solid #ccc; height: 26px; width: 26px; border-radius: 4px; cursor: pointer; font-size: 0.75rem; display: flex; align-items: center; justify-content: center; background: #fff; font-weight: bold; }
        .active-ok { background: var(--success) !important; color: white; border-color: var(--success); }
        .active-na { background: var(--na) !important; color: white; border-color: var(--na); }
        .input-desvio { width: 34px; text-align: center; border: 1px solid #ccc; height: 26px; border-radius: 3px; font-size: 0.9rem; padding: 0; }
        .is-fail-row { background-color: #f8d7da !important; }

        /* EPP */
        .btn-delete-epp { background: var(--danger); color: white; border: none; padding: 5px 10px; border-radius: 4px; font-size: 0.65rem; font-weight: bold; cursor: pointer; position: absolute; top: 8px; right: 8px; }
        .epp-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; margin-top: 12px; }
        .epp-box { background: #f9f9f9; padding: 4px; border-radius: 4px; border: 1px solid #eee; text-align: center; }
        .epp-box label { font-size: 0.65rem; color: #777; margin-bottom: 2px; }
        .epp-box select { padding: 3px; font-size: 0.9rem; height: auto; }

        /* FOTOS Y BOTONES */
        .photo-preview { width: 100%; border-radius: 8px; margin: 8px 0; border: 1px solid #ddd; max-height: 200px; object-fit: contain; background: #eee; display: none; }
        .btn-action { background: #6c757d; color: white; border: none; padding: 14px; border-radius: 8px; width: 100%; font-weight: bold; margin-top: 6px; cursor: pointer; font-size: 1rem; }
        .btn-enabled { display: block !important; background: var(--success) !important; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }

        /* FOOTER CENTRADO */
        .footer-score { position: fixed; bottom: 0; width: 100%; background: var(--primary); color: white; padding: 12px; display: flex; justify-content: center; gap: 40px; align-items: center; z-index: 1000; border-top: 2px solid var(--accent); }
        .stat-val { color: #f1c40f; font-weight: bold; font-size: 1.3rem; margin-left: 5px; }

        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .no-pdf { display: block; }
        .history-item { padding: 12px; border-bottom: 1px solid #eee; font-size: 0.85rem; background: #fff; cursor: pointer; }
    </style>
</head>
<body>

<div id="capture-area">
    <header>
        <strong>DOHM S.A.</strong><br>
        <small id="lock-status">Inspección de Seguridad y Medio Ambiente</small>
    </header>

    <nav class="tabs no-pdf">
        <button class="tab-btn active" onclick="showTab(event, 't1')">General</button>
        <button class="tab-btn" onclick="showTab(event, 't2')">Inspección</button>
        <button class="tab-btn" onclick="showTab(event, 't3')">EPP</button>
        <button class="tab-btn" onclick="showTab(event, 't4')">Oportunidades</button>
        <button class="tab-btn" onclick="showTab(event, 't5')">Fotos</button>
    </nav>

    <div class="container">
        <!-- SECCIÓN 1: GENERAL -->
        <div id="t1" class="tab-content active">
            <div class="card">
                <h3>Datos de Campo</h3>
                <div class="field"><label>Sector / Lugar específico</label><input type="text" id="c_sector" oninput="saveLocal()"></div>
                <div class="field">
                    <label>Supervisor</label>
                    <select id="c_super" onchange="handleAdminSelect(this); saveLocal()">
                        <option value="">Seleccione Supervisor...</option>
                        <option value="Admin">⭐ Administrador</option>
                        <option>Cejas Leonardo</option><option>Gerez Jonatan</option><option>Gil Miguel</option>
                        <option>Godoy Julio</option><option>Liguori David</option><option>Luchetta Lucas</option>
                        <option>Moyano Carlos</option><option>Nerone Jorge</option><option>Pardo Rubén</option>
                        <option>Rojas Fernando</option><option>Sánchez Roberto</option><option>Tello Victoria</option>
                        <option>Torres Ramón</option>
                    </select>
                </div>
                <div class="field"><label>Cant. Operarios</label><input type="number" id="n_ops" value="1" oninput="calc(); saveLocal()"></div>
                <div style="display:flex; gap:8px;">
                    <div class="field" style="flex:1"><label>Fecha</label><input type="date" id="f_insp" oninput="saveLocal()"></div>
                    <div class="field" style="flex:1"><label>Hora</label><input type="time" id="h_insp" oninput="saveLocal()"></div>
                </div>
                <button class="no-pdf" onclick="fetchHistory()" style="background:var(--primary); color:white; border:none; padding:12px; border-radius:5px; width:100%; font-size:0.9rem; font-weight:bold; margin-top:5px;">HISTORIAL</button>
                <div id="hist-container" style="max-height:120px; overflow-y:auto; margin-top:5px; border:1px solid #ddd; display:none;"></div>
            </div>
        </div>

        <!-- SECCIÓN 2: INSPECCIÓN -->
        <div id="t2" class="tab-content">
            <div id="items-list"></div>
        </div>

        <!-- SECCIÓN 3: EPP -->
        <div id="t3" class="tab-content">
            <div id="workers-container"></div>
            <button id="add-op-btn" class="btn-green no-pdf" style="background:var(--accent); color:white; border:none; padding:15px; border-radius:8px; width:100%; font-weight:bold;" onclick="addWorker(); saveLocal()">+ AGREGAR OPERARIO</button>
        </div>

        <!-- SECCIÓN 4: OPORTUNIDADES -->
        <div id="t4" class="tab-content">
            <div class="card">
                <div class="field"><label>Actitudes/Condiciones Inseguras</label><textarea rows="3" id="c_inseguras" oninput="saveLocal()"></textarea></div>
                <div class="field"><label>Medidas Correctivas Propuestas</label><textarea rows="3" id="c_correctivas" oninput="saveLocal()"></textarea></div>
                <div class="field"><label>Observaciones Generales</label><textarea rows="3" id="c_obs" oninput="saveLocal()"></textarea></div>
                <hr>
                <div class="field">
                    <label>Fecha estimada de cumplimiento (Autom)</label>
                    <input type="date" id="f_restringida" disabled>
                </div>
                <div class="field">
                    <label>Fecha real de cumplimiento</label>
                    <input type="date" id="f_cierre_real" oninput="saveLocal()">
                </div>
            </div>
        </div>

        <!-- SECCIÓN 5: FOTOS -->
        <div id="t5" class="tab-content">
            <div class="card">
                <h3>Desvío hallado</h3>
                <input type="file" accept="image/*" class="no-pdf" onchange="handlePhoto(this, 'img-hallado', 'btn-guardar-insp')">
                <img id="img-hallado" class="photo-preview">
                <button id="btn-guardar-insp" class="btn-action" onclick="saveToDrive('GUARDADA')">GUARDAR INSPECCIÓN</button>
            </div>
            <div class="card">
                <h3>Desvío corregido</h3>
                <input type="file" accept="image/*" class="no-pdf" onchange="handlePhoto(this, 'img-corregido', 'btn-cerrar-op')">
                <img id="img-corregido" class="photo-preview">
                <button id="btn-cerrar-op" class="btn-action" onclick="saveToDrive('CERRADA', true)">CIERRE DE OPORTUNIDAD (PDF)</button>
            </div>
            <button class="no-pdf" onclick="resetApp()" style="margin-top:20px; border:none; background:none; color:red; font-size:0.7rem; width:100%">REINICIAR INSPECCIÓN</button>
        </div>
    </div>
</div>

<div class="footer-score no-pdf">
    <div>SUBT: <span class="stat-val" id="res-st">0.00</span></div>
    <div>ÍNDICE: <span class="stat-val" id="res-idx" style="color:#2ecc71">0.0</span></div>
</div>

        { id: 54, c: "Accidentologia", d: "Accidente o primer auxilio riesgo bajo", p: 2.5, x: false },
        { id: 55, c: "Accidentologia", d: "Accidente o primer auxilio riesgo medio", p: 5, x: false },
        { id: 56, c: "Accidentologia", d: "Accidente o primer auxilio riesgo alto", p: 10, x: false }
    ];

    function renderItems() {
        const container = document.getElementById('items-list');
        let currentCat = "";
        itemsData.forEach(item => {
            if (item.c !== currentCat) { currentCat = item.c; container.innerHTML += `<div class="card"><h3>${currentCat}</h3><div id="cg-${item.id}"></div></div>`; }
            container.querySelector('.card:last-child').innerHTML += `
                <div class="check-item" id="row-${item.id}">
                    <div class="item-desc">${item.id}. ${item.d}</div>
                    <div class="item-controls">
                        <button class="btn-status" onclick="setStatus(${item.id}, 'ok')">✓</button>
                        <button class="btn-status" onclick="setStatus(${item.id}, 'na')">X</button>
                        <input type="number" class="input-desvio" id="val-${item.id}" data-p="${item.p}" data-x="${item.x}" value="0" oninput="setStatus(${item.id}, 'fail'); saveLocal()">
                    </div>
                </div>`;
        });
    }

    function setStatus(id, status) {
        if(isLocked) return;
        const row = document.getElementById(`row-${id}`);
        const input = document.getElementById(`val-${id}`);
        const btns = row.querySelectorAll('.btn-status');
        row.classList.remove('is-ok', 'is-na', 'is-fail-row');
        btns.forEach(b => b.classList.remove('active-ok', 'active-na'));
        if (status === 'ok') { btns[0].classList.add('active-ok'); input.value = 0; }
        else if (status === 'na') { btns[1].classList.add('active-na'); input.value = 0; }
        else if (status === 'fail' && input.value > 0) { row.classList.add('is-fail-row'); }
        calc();
    }

    async function saveToDrive(estado, downloadPDF = false) {
        const payload = {
            sector: document.getElementById('c_sector').value, supervisor: document.getElementById('c_super').value,
            operarios: document.getElementById('n_ops').value, subtotal: document.getElementById('res-st').innerText,
            indice: document.getElementById('res-idx').innerText, inseguras: document.getElementById('c_inseguras').value,
            correctivas: document.getElementById('c_correctivas').value, observaciones: document.getElementById('c_obs').value,
            fecha_estimada: document.getElementById('f_restringida').value, fecha_real: document.getElementById('f_cierre_real').value,
            estado: estado
        };
        try {
            await fetch(WEB_APP_URL, { method: "POST", mode: "no-cors", body: JSON.stringify(payload) });
            alert("Base de Datos sincronizada con éxito.");
            if(estado === 'GUARDADA') lockApp();
            if(downloadPDF) makePDF();
        } catch (e) { alert("Error al guardar."); }
    }

    function lockApp() {
        isLocked = true;
        document.getElementById('lock-status').innerText = "MODO: CONSULTA (BLOQUEADO)";
        document.getElementById('lock-status').style.color = "red";
        document.querySelectorAll('input, select, textarea').forEach(i => { if(i.id !== 'f_cierre_real' && i.type !== 'file') i.disabled = true; });
        document.getElementById('add-op-btn').style.display = 'none';
        saveLocal();
    }

    function handlePhoto(input, imgId, btnId) {
        if (input.
